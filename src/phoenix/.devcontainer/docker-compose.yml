services:
  app:
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile
    volumes:
      - ..:/workspace:cached
    ports:
      - 4000:4000
    command: sleep infinity

  postgresql:
    image: postgres:latest
    restart: unless-stopped
    volumes:
      - db-data:/var/lib/postgresql
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: app_dev
    ports:
      - 5432:5432

  sqlite3:
    image: alpine:latest
    command: echo "SQLite3 selected — no separate database service needed."
    restart: "no"

volumes:
  db-data:
